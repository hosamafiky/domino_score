name: domino_score
description: Domino score tracking app with sessions, matches, and stats.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.5

  # State & DI
  flutter_bloc: ^8.1.6
  get_it: ^8.0.2
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # Functional
  dartz: ^0.10.1

  # Localization & intl
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.3.3

  # Utils
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
